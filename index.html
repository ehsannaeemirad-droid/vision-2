const PAGES=[{id:"getready",title:"Get Ready",pages:"17–18",icon:"🗺️",faDesc:"نقشه",studyKey:null,html:"<div class='book-section-title'>Get Ready</div><p class='book-text'>Look at the map.</p>"},{id:"conversation",title:"Conversation",pages:"19–20",icon:"💬",faDesc:"مصاحبه",studyKey:"conversation",html:"<div class='book-section-title'>Conversation</div><div class='dialogue'><p><strong>Meysam:</strong> I heard you know three languages.</p><p><strong>Mr. Saberian:</strong> Actually four. Besides my mother tongue, Persian, I know English, French and Russian well. I began learning English when I was thirteen. Interest and hard work are more important than age. My favorite language is absolutely my mother tongue!</p></div>"},{id:"newwords",title:"New Words",pages:"21–23",icon:"📖",faDesc:"واژگان",studyKey:"newwords",html:"<div class='book-section-title'>New Words</div><div class='vocab-item'><strong>continent</strong></div><div class='vocab-item'><strong>despite</strong></div>"},{id:"reading",title:"Reading",pages:"24–26",icon:"📑",faDesc:"متن",studyKey:"reading",html:"<div class='book-section-title'>Reading</div><p class='book-text'>Language is a system of communication. About <strong>7000 languages</strong> exist in the world.</p><p class='book-text'>The most popular language is Chinese.</p><p class='book-text'>Languages with few speakers are <strong>endangered languages</strong>.</p><p class='book-text'>All languages are valuable, despite their differences. We should respect all languages.</p>"},{id:"grammar",title:"Grammar",pages:"28–31",icon:"🔤",faDesc:"گرامر",studyKey:"grammar",html:"<div class='book-section-title'>Grammar</div><p class='book-text'>Countable: many books · Uncountable: much information</p>"},{id:"listening",title:"Listening",pages:"34–35",icon:"🛒",faDesc:"شنیداری",studyKey:"listening",html:"<div class='book-section-title'>Listening</div><p class='book-text'>How much / How many</p>"},{id:"writing",title:"Writing",pages:"37–45",icon:"✍️",faDesc:"نوشتن",studyKey:"writing",html:"<div class='book-section-title'>Writing</div><p class='book-text'>Subject + Verb</p>"}];
let currentPageIdx=0,studySteps=[],studyIdx=0,selectedSlots=[],currentBank=[],quizIdx=0,quizCorrect=0;
let taughtWords=new Set(JSON.parse(localStorage.getItem("v2_taught")||"[]"));
let completedSections=new Set(JSON.parse(localStorage.getItem("v2_done")||"[]"));
let flashcards=JSON.parse(localStorage.getItem("v2_fc")||"[]");
function init(){renderTOC();updateFcBadge();showScreen("homeScreen")}
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function goHome(){showScreen("homeScreen");document.getElementById("headerTitle").innerText="Vision 2";renderTOC()}
function renderTOC(){const list=document.getElementById("sectionList");list.innerHTML="";PAGES.forEach((p,i)=>{const done=completedSections.has(p.id);const card=document.createElement("div");card.className="section-card";card.onclick=()=>openPage(i);card.innerHTML=(done?'<span class="sec-done">✓ تمام</span>':'')+'<div class="sec-icon">'+p.icon+'</div><div class="sec-info"><h3>'+p.title+'</h3><p>'+p.faDesc+'</p></div><span class="sec-pages">'+p.pages+'</span>';list.appendChild(card)})}
function openPage(idx){currentPageIdx=idx;renderBookPage();showScreen("bookScreen")}
function renderBookPage(){const p=PAGES[currentPageIdx];document.getElementById("headerTitle").innerText=p.title;const done=completedSections.has(p.id);const studyBtn=p.studyKey?'<button class="study-btn '+(done?'done':'')+'" onclick="startStudy(\''+p.studyKey+'\')">'+(done?'✅ دوباره':'📚 مطالعه (Easy)')+'</button>':'';document.getElementById("bookContent").innerHTML='<div class="page-header">'+studyBtn+'<span class="page-num-badge">صفحه '+p.pages+'</span></div>'+p.html;document.getElementById("prevBtn").disabled=currentPageIdx===0;document.getElementById("nextBtn").disabled=currentPageIdx===PAGES.length-1}
function prevPage(){if(currentPageIdx>0){currentPageIdx--;renderBookPage()}}
function nextPage(){if(currentPageIdx<PAGES.length-1){currentPageIdx++;renderBookPage()}}
function startStudy(key){const data=STUDY[key];if(!data)return;studySteps=data.steps;studyIdx=0;quizIdx=0;quizCorrect=0;selectedSlots=[];document.getElementById("headerTitle").innerText="مطالعه · "+data.title;showScreen("studyScreen");renderStudyStep()}
function updateProgress(){document.getElementById("studyProgress").style.width=(studySteps.length?Math.round(studyIdx/studySteps.length*100):0)+"%"}
function renderStudyStep(){updateProgress();const container=document.getElementById("studyContent");const nextBtn=document.getElementById("studyNextBtn");const label=document.getElementById("stepLabel");nextBtn.classList.add("hidden");nextBtn.onclick=null;container.innerHTML="";if(studyIdx>=studySteps.length){const page=PAGES[currentPageIdx];if(page){completedSections.add(page.id);localStorage.setItem("v2_done",JSON.stringify([...completedSections]))}label.innerText="";container.innerHTML='<div class="finish-box"><h2>🎉 آفرین!</h2><p>تمام شد.</p></div>';nextBtn.classList.remove("hidden");nextBtn.innerText="↩️ بازگشت";nextBtn.onclick=()=>{showScreen("bookScreen");renderBookPage()};return}const step=studySteps[studyIdx];label.innerText="مرحله "+(studyIdx+1)+" از "+studySteps.length;if(step.type==="word")renderWordStep(step,container,nextBtn);else if(step.type==="phrase")renderBuildStep(step,container,nextBtn,false);else if(step.type==="sentence")renderBuildStep(step,container,nextBtn,true);else if(step.type==="grammar")renderGrammarStep(step,container,nextBtn);else if(step.type==="quiz")renderQuizStep(step,container,nextBtn)}
function renderWordStep(step,container,nextBtn){const w=step.word;const info=DICT[w]||{fa:"—"};taughtWords.add(w.toLowerCase());localStorage.setItem("v2_taught",JSON.stringify([...taughtWords]));speakTwice(w);const isSaved=flashcards.some(f=>f.word.toLowerCase()===w.toLowerCase());container.innerHTML='<div class="word-teach"><div class="word-big"><button class="tts-btn" onclick="speak(\''+esc(w)+'\')">🔊</button><span>'+w+'</span></div><div class="word-meaning">'+info.fa+'</div><div class="action-row"><button class="btn save-btn" id="saveWordBtn" '+(isSaved?'disabled':'')+'>'+(isSaved?'✅ ذخیره':'➕ فلش‌کارت')+'</button></div></div>';if(!isSaved)document.getElementById("saveWordBtn").onclick=()=>{flashcards.push({word:w,meaning:info.fa});localStorage.setItem("v2_fc",JSON.stringify(flashcards));updateFcBadge();document.getElementById("saveWordBtn").disabled=true;document.getElementById("saveWordBtn").innerText="✅ ذخیره"};nextBtn.classList.remove("hidden");nextBtn.innerText="یاد گرفتم ←";nextBtn.onclick=()=>{studyIdx++;renderStudyStep()}}
function renderBuildStep(step,container,nextBtn,isSentence){selectedSlots=[];currentBank=shuffle([...step.bank]);const prompt=isSentence?"جمله را با عبارت‌ها بساز":"عبارت را بساز";const hint=isSentence?'<div class="chunk-hint">از عبارت‌های آماده‌شده استفاده کن</div>':'';container.innerHTML='<div class="build-wrap"><div class="build-prompt">'+prompt+'</div><div class="build-fa">'+step.fa+'</div>'+hint+'<div class="slots" id="buildSlots"></div><div class="bank-row" id="buildBank"></div><div class="check-msg" id="checkMsg"></div><div class="help-bar"><button class="help-btn" onclick="toggleHelp()">🆘 کمک</button></div><div class="help-panel" id="helpPanel"></div></div>';renderBank(isSentence);renderSlotsUI(isSentence);nextBtn.classList.remove("hidden");nextBtn.innerText="بررسی";nextBtn.onclick=()=>checkBuild(step)}
function renderBank(isSentence){const el=document.getElementById("buildBank");if(!el)return;el.innerHTML="";currentBank.forEach(item=>{const btn=document.createElement("button");btn.className="bank-word"+(isSentence?" phrase-chunk":"");btn.innerText=item;btn.onclick=()=>{selectedSlots.push(item);const idx=currentBank.indexOf(item);if(idx>=0)currentBank.splice(idx,1);renderBank(isSentence);renderSlotsUI(isSentence)};el.appendChild(btn)})}
function renderSlotsUI(isSentence){const slots=document.getElementById("buildSlots");if(!slots)return;slots.innerHTML="";selectedSlots.forEach((item,i)=>{const btn=document.createElement("button");btn.className="slot-word"+(isSentence?" phrase-chunk":"");btn.innerText=item;btn.onclick=()=>{selectedSlots.splice(i,1);currentBank.push(item);renderBank(isSentence);renderSlotsUI(isSentence)};slots.appendChild(btn)})}
function normalize(s){return String(s).toLowerCase().replace(/[?.!,;:"']/g,"").replace(/\s+/g," ").trim()}
function checkBuild(step){const msg=document.getElementById("checkMsg");const nextBtn=document.getElementById("studyNextBtn");const answer=normalize(selectedSlots.join(" "));const target=normalize(step.target);if(answer===target){msg.className="check-msg ok";msg.innerText="✅ درست!";speak(step.target);nextBtn.innerText="ادامه ←";nextBtn.onclick=()=>{studyIdx++;renderStudyStep()}}else{msg.className="check-msg bad";msg.innerText="❌ دوباره"}}
function toggleHelp(){const panel=document.getElementById("helpPanel");if(!panel)return;if(panel.classList.contains("show")){panel.classList.remove("show");return}const step=studySteps[studyIdx];let items=[];if(step.type==="sentence"){step.bank.forEach(ph=>{const meanings=ph.split(" ").map(w=>(DICT[w]||{fa:"?"}).fa).join(" + ");items.push({en:ph,fa:meanings})})}else{[...new Set([...(step.bank||[]),...selectedSlots])].forEach(w=>items.push.push({en:w,fa:(DICT[w]||{fa:"?"}).fa}))}panel.innerHTML=items.map(it=>'<div class="help-word-item"><span class="en">'+it.en+'</span><span class="fa">'+it.fa+'</span></div>').join("");panel.classList.add("show")}
function renderGrammarStep(step,container,nextBtn){container.innerHTML='<div class="grammar-note"><span class="label">نکته</span><h3>'+step.title+'</h3><p>'+step.text+'</p></div>';nextBtn.classList.remove("hidden");nextBtn.innerText="متوجه شدم ←";nextBtn.onclick=()=>{studyIdx++;renderStudyStep()}}
function renderQuizStep(step,container,nextBtn){quizIdx=0;quizCorrect=0;showQuizQuestion(step,container,nextBtn)}
function showQuizQuestion(step,container,nextBtn){const qs=step.questions;if(quizIdx>=qs.length){const passed=quizCorrect>=Math.ceil(qs.length*.7);container.innerHTML='<div class="finish-box"><h2>'+(passed?'🎉 قبول!':'📕 مرور')+'</h2><p>'+quizCorrect+' از '+qs.length+'</p></div>';nextBtn.classList.remove("hidden");if(passed){nextBtn.innerText="ادامه ←";nextBtn.onclick=()=>{studyIdx++;renderStudyStep()}}else{nextBtn.innerText="دوباره";nextBtn.onclick=()=>{studyIdx=0;renderStudyStep()}}return}const q=qs[quizIdx];nextBtn.classList.add("hidden");container.innerHTML='<div class="step-label">سؤال '+(quizIdx+1)+' از '+qs.length+'</div><div class="quiz-q">'+q.q+'</div><div class="quiz-options" id="quizOpts"></div>';const optsEl=document.getElementById("quizOpts");q.options.forEach((opt,i)=>{const btn=document.createElement("button");btn.className="quiz-opt";btn.innerText=opt;btn.onclick=()=>{optsEl.querySelectorAll(".quiz-opt").forEach(b=>b.classList.add("disabled"));if(i===q.answer){btn.classList.add("correct");quizCorrect++}else{btn.classList.add("wrong");optsEl.children[q.answer].classList.add("correct")}nextBtn.classList.remove("hidden");nextBtn.innerText=quizIdx+1<qs.length?"بعدی":"نتیجه";nextBtn.onclick=()=>{quizIdx++;showQuizQuestion(step,container,nextBtn)}};optsEl.appendChild(btn)})}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.6;speechSynthesis.speak(u)}
function speakTwice(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u1=new SpeechSynthesisUtterance(t);u1.lang="en-US";u1.rate=0.6;u1.onend=()=>setTimeout(()=>{const u2=new SpeechSynthesisUtterance(t);u2.lang="en-US";u2.rate=0.6;speechSynthesis.speak(u2)},400);speechSynthesis.speak(u1)}
function updateFcBadge(){document.getElementById("fcCount").innerText=flashcards.length}
function openFlashcards(){document.getElementById("headerTitle").innerText="فلش‌کارت‌ها";const list=document.getElementById("fcList");list.innerHTML=flashcards.length?flashcards.map((f,i)=>'<div class="fc-card"><div><div class="en">'+f.word+'</div><div class="fa">'+f.meaning+'</div></div><button class="header-btn" onclick="removeFc('+i+')">🗑️</button></div>').join(""):'<p style="text-align:center;padding:40px;color:#718096">خالی</p>';showScreen("fcScreen")}
function removeFc(i){flashcards.splice(i,1);localStorage.setItem("v2_fc",JSON.stringify(flashcards));updateFcBadge();openFlashcards()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/'/g,"\\'")}
init();
</script>
