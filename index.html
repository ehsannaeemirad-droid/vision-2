<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vision 2 · Lesson 1 – Interactive Book</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #58cc02; --primary-dark: #46a302; --bg: #f0f4f8; --card: #fff;
      --text: #2d3748; --muted: #718096; --border: #e2e8f0; --blue: #1cb0f6; --blue-dark: #1899d6; --accent: #e53e3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    #app { width: 100%; max-width: 720px; background: var(--card); min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,.06); display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2px solid var(--border); background: #fff; position: sticky; top: 0; z-index: 50; }
    .header h1 { font-size: 1.15rem; font-weight: 900; }
    .header-btn { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 10px; font-size: 1rem; cursor: pointer; }
    .fc-btn { background: #fef3c7; color: #d97706; border: 2px solid #fcd34d; font-weight: 700; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
    .badge { background: #d97706; color: #fff; border-radius: 999px; min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 900; }
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }
    .toc { padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
    .toc-title { text-align: center; margin-bottom: 8px; }
    .toc-title h2 { color: var(--primary-dark); font-size: 1.5rem; font-weight: 900; }
    .toc-title p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
    .section-card { border: 2px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; background: #fff; transition: .15s; }
    .section-card:hover { border-color: var(--primary); }
    .sec-icon { width: 48px; height: 48px; border-radius: 50%; background: #e0f2fe; border: 3px solid var(--blue); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .sec-info { flex: 1; }
    .sec-info h3 { font-size: 1.05rem; color: var(--primary-dark); margin-bottom: 2px; }
    .sec-info p { font-size: .82rem; color: var(--muted); line-height: 1.4; }
    .sec-pages { background: #f1f5f9; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
    .book-page { padding: 16px 18px 100px; background: #fefefe; flex: 1; overflow-y: auto; direction: ltr; text-align: left; font-family: Inter, system-ui, sans-serif; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; direction: rtl; font-family: Vazirmatn, sans-serif; }
    .page-num-badge { background: #edf2f7; color: #4a5568; font-weight: 700; font-size: .8rem; padding: 4px 12px; border-radius: 999px; }
    .study-btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: .95rem; cursor: pointer; box-shadow: 0 3px 0 var(--primary-dark); display: flex; align-items: center; gap: 6px; font-family: Vazirmatn, sans-serif; }
    .study-btn:active { transform: translateY(3px); box-shadow: none; }
    .book-section-title { background: linear-gradient(90deg,#1a5f9e,#3498db); color: #fff; display: inline-block; padding: 6px 16px; border-radius: 8px; font-size: 1.15rem; font-weight: 700; margin: 18px 0 12px; }
    .book-text { line-height: 1.7; font-size: .98rem; margin-bottom: 12px; color: #2d3748; }
    .dialogue { background: #f0f7ff; border-left: 4px solid #1a5f9e; padding: 12px 16px; margin: 12px 0; border-radius: 0 10px 10px 0; font-size: .95rem; line-height: 1.65; }
    .dialogue strong { color: #1a5f9e; }
    .word-bank { background: #fff8e6; border: 2px dashed #f0ad4e; border-radius: 10px; padding: 10px 14px; margin: 12px 0; font-size: .9rem; }
    .word-bank span { display: inline-block; background: #ffe8a1; padding: 2px 8px; margin: 2px; border-radius: 4px; font-weight: 600; }
    .placeholder-img { background: linear-gradient(135deg,#e2e8f0,#edf2f7); border: 2px dashed #a0aec0; border-radius: 10px; min-height: 120px; display: flex; align-items: center; justify-content: center; color: #718096; font-size: .9rem; margin: 12px 0; text-align: center; padding: 16px; flex-direction: column; gap: 6px; }
    .placeholder-img .icon { font-size: 2rem; }
    .exercise-box { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin: 14px 0; }
    .exercise-box h4 { color: #e53e3e; margin-bottom: 8px; font-size: .95rem; }
    .blank { display: inline-block; min-width: 90px; border-bottom: 1.5px solid #718096; margin: 0 3px; }
    table.book-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .9rem; }
    table.book-table th, table.book-table td { border: 1px solid #cbd5e0; padding: 8px 10px; text-align: left; }
    table.book-table th { background: #1a5f9e; color: #fff; }
    .hint-box { background: #fff7ed; border: 1px dashed #fdba74; border-radius: 8px; padding: 10px 14px; margin: 12px 0; font-size: .9rem; }
    .strategy-box { background: #e8f5e9; border: 2px solid #66bb6a; border-radius: 10px; padding: 12px 16px; margin: 14px 0; }
    .strategy-box h4 { color: #2e7d32; margin-bottom: 6px; }
    .vocab-item { background: #f3e5f5; border-left: 4px solid #8e24aa; padding: 8px 12px; margin: 8px 0; border-radius: 0 6px 6px 0; font-size: .92rem; }
    .vocab-item strong { color: #6a1b9a; }
    .questions-box { background: #e3f2fd; border-radius: 10px; padding: 12px 16px; margin: 14px 0; }
    .page-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 720px; background: #fff; border-top: 2px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; gap: 10px; z-index: 40; direction: rtl; font-family: Vazirmatn, sans-serif; }
    .nav-btn { flex: 1; background: #f1f5f9; border: 2px solid var(--border); border-radius: 12px; padding: 12px; font-weight: 700; font-size: .95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary-dark); box-shadow: 0 3px 0 var(--primary-dark); }
    #studyScreen { background: var(--bg); }
    .study-content { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; overflow-y: auto; }
    .focus-word-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; text-align: center; }
    .focus-word { font-size: 2.4rem; font-weight: 900; color: var(--text); display: flex; align-items: center; gap: 12px; direction: ltr; }
    .focus-meaning { font-size: 1.3rem; color: var(--muted); font-weight: 600; }
    .tts-btn { background: #e0f2fe; border: 2px solid var(--blue); border-radius: 50%; width: 48px; height: 48px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 14px 20px; font-size: 1.05rem; font-weight: 700; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 0 var(--primary-dark); text-align: center; font-family: Vazirmatn, sans-serif; width: 100%; }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn.secondary { background: #fff; color: var(--text); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
    .btn.save-btn { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }
    .build-area { direction: ltr; text-align: left; }
    .target-fa { text-align: center; font-size: 1.1rem; color: var(--muted); margin-bottom: 16px; font-weight: 600; }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; background: #f8fafc; border: 2px dashed #cbd5e0; border-radius: 12px; padding: 10px; margin-bottom: 18px; justify-content: center; direction: ltr; }
    .slot-word, .bank-word { background: #fff; border: 2px solid var(--border); border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: 1rem; direction: ltr; }
    .bank-word { background: #e0f2fe; border-color: var(--blue); }
    .word-bank-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: ltr; margin-bottom: 20px; }
    .check-result { text-align: center; font-weight: 700; font-size: 1.1rem; margin: 10px 0; min-height: 28px; }
    .check-result.ok { color: var(--primary-dark); }
    .check-result.bad { color: var(--accent); }
    .finish-box { text-align: center; padding: 40px 20px; }
    .finish-box h2 { font-size: 1.8rem; margin-bottom: 10px; }
    .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; margin: 0 16px 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
    .study-footer { padding: 12px 16px 20px; background: #fff; border-top: 2px solid var(--border); }
    .fc-list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .fc-card { background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; direction: ltr; }
    .fc-.fc-card .en { font-weight: 800; font-size: 1.1rem; }
    .fc-card .fa { color: var(--muted); font-size: .95rem; margin-top: 2px; direction: rtl; text-align: right; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="header-btn" onclick="goHome()">🏠</button>
    <h1 id="headerTitle">Vision 2</h1>
    <button class="fc-btn" onclick="openFlashcards()">🗂️ <span class="badge" id="fcCount">0</span></button>
  </div>
  <div id="homeScreen" class="screen active">
    <div class="toc">
      <div class="toc-title"><h2>Vision 2 · Lesson 1</h2><p>کتاب انگلیسی ۲ پایه یازدهم — صفحات کتاب را ورق بزن یا مطالعه کن</p></div>
      <div id="sectionList"></div>
    </div>
  </div>
  <div id="bookScreen" class="screen">
    <div class="book-page" id="bookContent"></div>
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn" onclick="prevPage()">→ قبلی</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextPage()">بعدی ←</button>
    </div>
  </div>
  <div id="studyScreen" class="screen">
    <div class="progress-bar"><div class="progress-fill" id="studyProgress" style="width:0%"></div></div>
    <div class="study-content" id="studyContent"></div>
    <div class="study-footer"><button class="btn hidden" id="studyNextBtn"></button></div>
  </div>
  <div id="fcScreen" class="screen"><div class="fc-list" id="fcList"></div></div>
</div>

</body>
</html>
